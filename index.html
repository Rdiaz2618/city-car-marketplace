<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <body class="layout">

    <header class="navbar">
      <nav class="container-nav">
        <div class="titulo-logo">
          <img src="./assets/images/logo-car-electric.svg" alt="" />
          <h2>Electric-car</h2>
        </div>

        <div class="hamburger">
          <button >☰</button>
        </div>
      </nav>
    </header>

    <!-- Filtro precios -->
    <section class="filter-box">

      <p>Ordenado por:</p>
      <select name="cars" id="cars">
        <option>Precio</option>
        <option>Precio mayor a menor</option>
        <option>Marca</option>
      </select>
    </section>

    <main class="container-cards">

        <div class="card" style="width: 18rem">
        <div class="card-body">
          <img src="./assets/images/auto-rosa.jpg" alt="auto-rosa" />
          <h5 class="card-title">Modelo: City Car</h5>

          <div class="btn">
          <button >
            <p class="card-text">Ver mas</p>
          </button>
          </div>
        </div>
      </div>

      <div class="next">
        <a href="#">
           <i class="fa-solid fa-angles-left"></i> 
        </a>
        <a href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">
           <i class="fa-solid fa-angles-right"></i>
        </a>
      </div>

    </main>

    <footer class="footer">
        <p><p>© 2026 City Car Rose | Conduciendo hacia el futuro.</p></p>
    </footer>

    <script
      src="https://kit.fontawesome.com/aaba1f8136.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
